<!DOCTYPE html>
<html>
<head>
    <title>Bag Collection</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightblue;
            text-align: center;
        }

        .container {
            display: inline-block;
            margin: 15px;
            padding: 10px;
            border: 2px solid black;
        }

        img {
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>

    <h1 style="color: darkblue;">My Bag Collection</h1> <!-- Inline CSS -->

    <!-- 5 Image Containers -->
    <div class="container">
        <img src="https://via.placeholder.com/200?text=Handbag" alt="Handbag">
        <p>Handbag</p>
    </div>

    <div class="container">
        <img src="https://via.placeholder.com/200?text=Backpack" alt="Backpack">
        <p>Backpack</p>
    </div>

    <div class="container">
        <img src="https://via.placeholder.com/200?text=Travel+Bag" alt="Travel Bag">
        <p>Travel Bag</p>
    </div>

    <div class="container">
        <img src="https://via.placeholder.com/200?text=School+Bag" alt="School Bag">
        <p>School Bag</p>
    </div>

    <div class="container">
        <img src="https://via.placeholder.com/200?text=Designer+Bag" alt="Designer Bag">
        <p>Designer Bag</p>
    </div>

</body>
</html>
h1 {
    font-family: Arial;
}

p {
    font-weight: bold;
}
