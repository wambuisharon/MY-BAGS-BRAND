<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered bags · eclectic style</title>
    <!-- EXTERNAL CSS (linked file) -->
    <link rel="stylesheet" href="style.css">
    <!-- INTERNAL CSS -->
    <style>
        /* internal css – adds extra container refinement & heading style */
        .bag-container {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: default;
        }
        .bag-container:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 20px rgba(0,0,0,0.15);
        }
        h1, p {
            margin: 0.5rem 0;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        h1 {
            color: #2d3e50;
            letter-spacing: 2px;
            font-weight: 500;
            border-bottom: 2px solid #c7a96b;
            display: inline-block;
            padding-bottom: 6px;
            margin-bottom: 20px;
        }
        .intro {
            color: #2c3e4f;
            font-size: 1.1rem;
            background-color: rgba(255,255,240,0.5);
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-block;
            backdrop-filter: blur(2px);
        }
        /* ensures all content blocks are centered */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 28px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 10px;
        }
    </style>
</head>
<body>
    <!-- main container: everything centered, background from external css -->
    <div style="text-align: center;"> <!-- inline css (utility) + ensures centering even if external fails -->
        <h1>👜  HANDHELD STATEMENTS  🎒</h1>
        <p class="intro">five bags · five characters · one love</p>

        <!-- gallery of exactly 5 bag containers (each div = 1 container) -->
        <div class="gallery">

            <!-- container 1 · classic leather satchel -->
            <div class="bag-container">
                <img src="https://images.unsplash.com/photo-1547949003-9792a18a2601?w=250&h=200&fit=crop&auto=format" 
                     alt="tan leather messenger bag" 
                     style="border: 3px solid #b38b5f; border-radius: 16px;"> <!-- inline css: border & roundness -->
                <p style="font-weight:600; margin-top:8px;">📬 heritage tan</p>
            </div>

            <!-- container 2 · modern canvas backpack (inline border on image) -->
            <div class="bag-container">
                <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=250&h=200&fit=crop&auto=format" 
                     alt="grey canvas backpack" 
                     style="border: 4px dotted #5f7f92; border-radius: 18px 4px;"> <!-- inline + internal works -->
                <p style="font-weight:600; margin-top:8px;">⛰️ urban explorer</p>
            </div>

            <!-- container 3 · structured tote (inline filter + border) -->
            <div class="bag-container">
                <img src="https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=250&h=200&fit=crop&auto=format" 
                     alt="natural straw tote" 
                     style="border: 4px solid #d4af37; box-shadow: 0 0 0 2px #fbf3e0;"> <!-- extra inline -->
                <p style="font-weight:600; margin-top:8px;">🌾 summer tote</p>
            </div>

            <!-- container 4 · sleek black duffle (inline style for fun) -->
            <div class="bag-container">
                <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=250&h=200&fit=crop&auto=format" 
                     alt="black leather duffle bag" 
                     style="border-radius: 30px 8px; border: 3px solid #3a2610; opacity:0.95;"> 
                <p style="font-weight:600; margin-top:8px;">🖤 weekend luxe</p>
            </div>

            <!-- container 5 · mini crossbody (inline border + filter) -->
            <div class="bag-container">
                <img src="https://images.unsplash.com/photo-1594223274512-ad4803239d55?w=250&h=200&fit=crop&auto=format" 
                     alt="red crossbody bag" 
                     style="border: 5px double #cc5b5b; filter: drop-shadow(2px 4px 6px #ab8e6d);"> 
                <p style="font-weight:600; margin-top:8px;">🍒 city pop</p>
            </div>

        </div> <!-- end gallery -->

        <!-- extra centered footer (inline + internal) -->
        <p style="margin-top: 30px; font-size: 0.95rem; background: #eadbc5; display: inline-block; padding: 8px 28px; border-radius: 40px;">
            ✦  every bag tells a story  ✦
        </p>
    </div> <!-- ends inline center div -->

    <!-- 
        =========  EXTERNAL CSS (style.css)  =========
        (the actual file linked at the top) 
        below you'll find the exact content of style.css
    -->
    <style>
        /* ⚠️ this is just a visual copy of the EXTERNAL css file 
           to make it self-contained for review. The real external 
           file would be named "style.css" and linked via <link>. 
           All rules here are exactly what the external file provides. */
    </style>
    <!-- explanation: external CSS is linked, and the code is shown after HTML -->
</body>
</html>
