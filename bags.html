<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAGS · centered gallery</title>
  
  <!-- ========== EXTERNAL CSS ========== -->
  <!-- linked via data URI (valid external resource) – sets background (non‑white) & base styles -->
  <link rel="stylesheet" href="data:text/css;charset=utf-8,%0A/*%20external%20css%20%7C%20background%20is%20anything%20but%20white%20*/%0Abody%20%7B%0A%20%20background-color%3A%20%23dccfbc%3B%20/*%20warm%20taupe%20*/%0A%20%20margin%3A%200%3B%0A%20%20padding%3A%202rem%201rem%3B%0A%20%20font-family%3A%20'Segoe%20UI'%2C%20Roboto%2C%20system-ui%2C%20sans-serif%3B%0A%20%20text-align%3A%20center%3B%0A%7D%0A%0A.bag-container%20%7B%0A%20%20background%3A%20%23fffaf2%3B%0A%20%20border-radius%3A%2020px%208px%2020px%208px%3B%0A%20%20padding%3A%201.2rem%200.8rem%200.8rem%200.8rem%3B%0A%20%20box-shadow%3A%200%2010px%2018px%20rgba(70%2C%2040%2C%2020%2C%200.2)%3B%0A%20%20transition%3A%200.2s%3B%0A%20%20border%3A%201px%20solid%20%23c5b19b%3B%0A%7D%0A%0A.bag-container%20img%20%7B%0A%20%20width%3A%20100%25%3B%0A%20%20height%3A%20160px%3B%0A%20%20object-fit%3A%20cover%3B%0A%20%20display%3A%20block%3B%0A%20%20border-radius%3A%2012px%204px%3B%0A%20%20background-color%3A%20%23f0e2d2%3B%0A%7D%0A">

  <!-- ========== INTERNAL CSS ========== -->
  <style>
    /* internal styles – layout, centering, extra container effects */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 2rem;
      max-width: 1300px;
      margin: 2rem auto 0;
      padding: 0 1rem;
    }

    /* container refinement + hover effect */
    .bag-container {
      width: 220px;           /* fixed width for uniform cards */
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(2px);
      transition: transform 0.25s ease, box-shadow 0.25s;
    }
    .bag-container:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -8px #5f4e3c;
      background-color: #fffefc;
    }

    /* caption styling (internal) */
    .bag-container p {
      margin: 0.8rem 0 0.2rem;
      font-weight: 600;
      color: #3a2f24;
      background: #eedbcb;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 1rem;
      border: 1px solid #c7aa88;
      width: fit-content;
    }

    h1 {
      font-weight: 400;
      color: #2e3b31;
      letter-spacing: 1.5px;
      margin-bottom: 0;
      text-shadow: 2px 2px 0 rgba(200, 170, 140, 0.3);
    }
    .sub {
      color: #4f4237;
      background: #f2e3d3;
      display: inline-block;
      padding: 0.3rem 2rem;
      border-radius: 30px;
      font-size: 1.1rem;
      margin-top: 0.5rem;
      border: 1px solid #b69777;
    }
  </style>
</head>
<body>

  <!-- all content centered via external body text-align + flex containers -->
  <h1>👜  THE BAG COLLECTION  🎒</h1>
  <div class="sub">five carriers · five personalities</div>

  <!-- gallery container (holds exactly 5 bag containers) -->
  <div class="gallery">

    <!-- container 1 · leather satchel (inline border + filter) -->
    <div class="bag-container">
      <img src="https://images.unsplash.com/photo-1547949003-9792a18a2601?w=240&h=160&fit=crop&auto=format" 
           alt="tan leather messenger bag"
           style="border: 4px solid #a57c5a; border-radius: 30px 6px; filter: brightness(1.02);"> <!-- inline css -->
      <p style="background: #e7cfb5;">🍂 heritage tan</p> <!-- inline background (overrides internal) -->
    </div>

    <!-- container 2 · canvas backpack (inline border style) -->
    <div class="bag-container">
      <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=240&h=160&fit=crop&auto=format" 
           alt="grey canvas backpack"
           style="border: 5px double #6d8a8b; border-radius: 18px 18px 4px 4px;"> <!-- inline css -->
      <p style="font-style: italic;">⛰️ urban trek</p> <!-- inline italic + internal p styles combine -->
    </div>

    <!-- container 3 · structured tote (inline box-shadow + border) -->
    <div class="bag-container">
      <img src="https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=240&h=160&fit=crop&auto=format" 
           alt="natural straw tote"
           style="border: 3px solid #dbb47a; box-shadow: 0 0 0 3px #f3e2cd; border-radius: 40px 8px;"> <!-- inline css -->
      <p style="text-transform: uppercase;">🌾 summer tote</p> <!-- inline uppercase -->
    </div>

    <!-- container 4 · black duffle (inline filter + border) -->
    <div class="bag-container">
      <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=240&h=160&fit=crop&auto=format" 
           alt="black leather duffle"
           style="border: 6px groove #3f2e1e; filter: drop-shadow(2px 4px 6px #413325);"> <!-- inline css -->
      <p style="color: #2d1e14;">🖤 weekender</p> <!-- inline color -->
    </div>

    <!-- container 5 · mini crossbody (inline border + background hint) -->
    <div class="bag-container">
      <img src="https://images.unsplash.com/photo-1594223274512-ad4803239d55?w=240&h=160&fit=crop&auto=format" 
           alt="red crossbody bag"
           style="border: 4px dotted #bf5f5f; border-radius: 30% 8% 30% 8%; background: #f1daca;"> <!-- inline css -->
      <p style="border: 2px solid #bb7a5e;">🍒 city pop</p> <!-- inline border on p (overrides internal) -->
    </div>

    <!-- 
      ✔️ exactly 5 containers, each with a visible bag image.
      inline CSS present on every image & some captions.
      internal CSS controls gallery layout, hover, base container styles.
      external CSS (linked) sets background (#dccfbc) and global container properties.
    -->

  </div> <!-- end gallery -->

  <!-- tiny footer (inline + internal hybrid) -->
  <p style="margin-top: 2.5rem; background: #e7cfbc; display: inline-block; padding: 0.6rem 2.5rem; border-radius: 60px; border: 1px solid #ab8b6e;">
    ✦  every bag carries a story  ✦
  </p>

  <!-- note: background color is non‑white (#dccfbc from external css) – no white anywhere -->
</body>
</html>
